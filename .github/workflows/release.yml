name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo xtask bundle hardwave-analyser --release

      - name: Package
        run: |
          cd target/bundled
          tar -czvf hardwave-analyser-linux-x64.tar.gz hardwave-analyser.vst3 hardwave-analyser.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-analyser-linux-x64
          path: target/bundled/hardwave-analyser-linux-x64.tar.gz

  build-windows:
    # A real Windows runner, like every other Hardwave plug-in uses.
    #
    # This job cross-compiled with cargo-xwin on a Linux runner until 2026-09-16. Measured on one
    # machine, same commit, same validator: the cross-compiled build crashed three of the validator
    # tests, the natively built one crashed none, and the crashes moved to different tests between
    # runs of the same binary, which is memory corruption rather than a bug in our code. That is
    # what the OS testers were reporting as "Analyser is red on Windows" for weeks.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo xtask bundle hardwave-analyser --release

      - name: Package
        run: |
          cd target/bundled
          7z a -tzip hardwave-analyser-windows-x64.zip hardwave-analyser.vst3 hardwave-analyser.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-analyser-windows-x64
          path: target/bundled/hardwave-analyser-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build (Apple Silicon)
        run: |
          cargo xtask bundle hardwave-analyser --release
          cp target/bundled/hardwave-analyser.vst3/Contents/MacOS/hardwave-analyser /tmp/hw-arm64-vst3
          cp target/bundled/hardwave-analyser.clap/Contents/MacOS/hardwave-analyser /tmp/hw-arm64-clap

      - name: Build (Intel, cross-compile)
        run: cargo xtask bundle hardwave-analyser --release --target x86_64-apple-darwin

      - name: Create universal binaries with lipo
        run: |
          lipo -create \
            /tmp/hw-arm64-vst3 \
            target/bundled/hardwave-analyser.vst3/Contents/MacOS/hardwave-analyser \
            -output target/bundled/hardwave-analyser.vst3/Contents/MacOS/hardwave-analyser
          lipo -create \
            /tmp/hw-arm64-clap \
            target/bundled/hardwave-analyser.clap/Contents/MacOS/hardwave-analyser \
            -output target/bundled/hardwave-analyser.clap/Contents/MacOS/hardwave-analyser

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-analyser-macos-universal.zip hardwave-analyser.vst3 hardwave-analyser.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-analyser-macos-universal
          path: target/bundled/hardwave-analyser-macos-universal.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release (as pre-release — admin publishes via /dashboard/admin/releases)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Hardwave Analyser ${{ steps.version.outputs.version }}
          draft: false
          # Clean tags publish as stable Latest; -rc/-beta stay pre-release.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/hardwave-analyser-linux-x64/*.tar.gz
            artifacts/hardwave-analyser-windows-x64/*.zip
            artifacts/hardwave-analyser-macos-universal/*.zip
          body: |
            ## Hardwave Analyser ${{ steps.version.outputs.version }}

            VST3/CLAP spectrum analyser plugin — powered by Hardwave Studios.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x64 | `hardwave-analyser-linux-x64.tar.gz` |
            | Windows x64 | `hardwave-analyser-windows-x64.zip` |
            | macOS (Universal) | `hardwave-analyser-macos-universal.zip` |

            ### Installation

            **Windows:**
            1. Extract the zip
            2. Copy `hardwave-analyser.vst3` folder to `C:\Program Files\Common Files\VST3\`
            3. Copy `hardwave-analyser.clap` to `C:\Program Files\Common Files\CLAP\`

            **Linux:**
            1. Extract: `tar -xzf hardwave-analyser-linux-x64.tar.gz`
            2. Copy to `~/.vst3/` and `~/.clap/`

            **macOS:**
            1. Extract the zip
            2. Copy `hardwave-analyser.vst3` to `~/Library/Audio/Plug-Ins/VST3/`
            3. Copy `hardwave-analyser.clap` to `~/Library/Audio/Plug-Ins/CLAP/`

            > **Note:** On first launch macOS may show a security warning. Right-click the plugin in Finder and choose Open, or go to System Settings → Privacy & Security and click Allow.

            ### Usage

            1. Add **Hardwave Analyser** to any channel in your DAW
            2. The plugin opens an embedded spectrum analyser (free for everyone — sign in once with your free account)
            3. Log in once — credentials are saved locally

      # sync-version + product DB updates are gated to STABLE tags only.
      # Pre-release tags (-alpha/-beta/-rc) build binaries and create the GH pre-release,
      # but the website's products.current_version + download URLs only flip when the admin
      # promotes the release to public via /dashboard/admin/releases.
      - name: Sync version to website DB (stable tags only)
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        run: |
          curl -sf -X POST https://hardwavestudios.com/api/internal/sync-version \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" \
            -d "{\"slug\":\"analyser\",\"version\":\"${{ steps.version.outputs.version }}\"}"

      - name: Update product database (stable tags only)
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 46.225.219.184 >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@46.225.219.184"

          BASE="https://github.com/Dishairano/hardwave-analyser-vst/releases/download/${VERSION}"
          # The database password stays on the server: read it from the site's env there.
          SQL="
            UPDATE products SET
              current_version = '${VERSION_NUM}',
              download_url_windows = '${BASE}/hardwave-analyser-windows-x64.zip',
              download_url_mac     = '${BASE}/hardwave-analyser-macos-universal.zip',
              download_url_linux   = '${BASE}/hardwave-analyser-linux-x64.tar.gz'
            WHERE slug = 'analyser';
            INSERT INTO plugin_versions (slug, version) VALUES ('analyser', '${VERSION}')
              ON DUPLICATE KEY UPDATE version = '${VERSION}';
          "
          printf '%s\n' "$SQL" | $SSH 'docker exec -i -e MYSQL_PWD="$(grep -m1 "^DATABASE_PASSWORD=" /opt/hardwave/studio/.env.local | cut -d= -f2-)" hardwave-database mysql -u fl_organizer_user fl_organizer_db'

          echo "Database updated: analyser -> ${VERSION_NUM}"
          rm -f ~/.ssh/deploy_key
      - name: Post Discord changelog
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BETA_WEBHOOK_URL: ${{ secrets.DISCORD_BETA_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_NAME: "Hardwave Analyser"
        run: |
          set -eu
          # Release announcements (founder's rule, 2026-09-15): a clean tag gets its
          # version post on the changelog webhook; a release candidate (any "-"
          # suffix) notifies beta testers only, and founders are beta testers.
          # An RC never posts on the public webhook: without a beta webhook
          # secret it is skipped.
          case "$VERSION" in
            *-*)
              HOOK="${DISCORD_BETA_WEBHOOK_URL:-}"
              if [ -z "$HOOK" ]; then
                echo "Release candidate ${VERSION}: no DISCORD_BETA_WEBHOOK_URL secret, not posting"
                exit 0
              fi
              # A release candidate pings the Beta-tester role (founders are beta testers).
              BETA_MENTION="<@&1472011152887119873> New release candidate to test: ${PLUGIN_NAME} ${VERSION}. Switch the Hardwave Suite to the Beta channel to get it."
              ;;
            *)
              HOOK="$DISCORD_WEBHOOK_URL"
              ;;
          esac
          # Read bullets from CHANGELOG.md, scoped to the matching `## <VERSION>`
          # section. Each section ends at the next `## v` header or EOF.
          # Bullets are lines starting with `- ` or `* ` at the top level of
          # that section — sub-bullets (indented) are ignored so the Discord
          # post matches what a human would read as "what's new."
          #
          # If the CHANGELOG is missing or the section has no bullets, falls
          # back to the placeholder so the post never breaks — but also logs
          # a warning so the next contributor knows to fix the source.
          BULLETS=""
          if [ -f CHANGELOG.md ]; then
            # Sections (New features, Bug fixes, Improvements) come through as bold lines, and
            # bullets as bullets, whether they are written with -, * or the bullet character.
            BULLETS=$(awk -v v="$VERSION" '
              $0 ~ "^## " v "( |$)" { in_section=1; next }
              in_section && /^## v/ { exit }
              in_section && /^[*-] / { sub(/^[*-] +/, ""); print "- " $0; next }
              in_section && /^\xe2\x80\xa2 / { sub(/^\xe2\x80\xa2 +/, ""); print "- " $0; next }
              in_section && /^(New features|Bug fixes|Improvements)[[:space:]]*$/ { print "**" $0 "**"; next }
            ' CHANGELOG.md)
          else
            echo "WARNING: CHANGELOG.md missing — Discord post will fall back to placeholder" >&2
          fi
          if [ -z "$BULLETS" ]; then
            echo "WARNING: no bullets found in CHANGELOG.md for $VERSION — using placeholder" >&2
            BULLETS="Stability and maintenance updates"
          fi

          DESC_BODY=$(printf '%s\n' "$BULLETS" \
            | sed -e '/^[[:space:]]*$/d' \
                  -e 's/[[:space:]]*\.$//' \
                  -e 's/^/- /' \
                  -e 's/$/./')

          DESCRIPTION=$(printf "**What's new**\n%s\n\nInstall or update via the **Hardwave Suite**." "$DESC_BODY")
          PUB_DATE=$(date -u +"%-d %b %Y")
          FOOTER="${PLUGIN_NAME} · published ${PUB_DATE}"
          TITLE="${PLUGIN_NAME} ${VERSION}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg footer "$FOOTER" \
            '{
              "embeds": [{
                "title": $title,
                "description": $description,
                "color": 14427686,
                "footer": { "text": $footer }
              }]
            }')

          if [ -n "${BETA_MENTION:-}" ]; then
            PAYLOAD=$(printf '%s' "$PAYLOAD" | jq --arg c "$BETA_MENTION" \
              '. + {content: $c, allowed_mentions: {parse: [], roles: ["1472011152887119873"]}}')
          fi
          curl -fsS -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$HOOK" >/dev/null
          echo "Discord changelog posted for ${VERSION}"

