name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libx11-dev libxcb1-dev \
            libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgl1-mesa-dev libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Clippy (strict)
        run: cargo clippy --release -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Build plugin bundle
        run: cargo xtask bundle hardwave-analyser --release
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
