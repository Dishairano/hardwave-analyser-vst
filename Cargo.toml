[workspace]
members = ["xtask"]

[package]
name = "hardwave-analyser"
version = "1.0.35-rc1"
edition = "2021"
authors = ["Hardwave Studios"]
license = "GPL-3.0-only"
description = "VST3/CLAP spectrum analyser plugin with embedded webview UI"

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTPS through rustls with the bundled webpki roots, the same setup the other plug-ins use: every
# agent, including ureq's default one behind `ureq::post`, gets a TLS connector without any code of
# ours. ureq's `native-tls` feature does not: each agent must be handed a connector, and without one
# every https:// request fails with "Unknown Scheme".
ureq = { version = "2", default-features = false, features = ["tls"] }
nih_plug = { git = "https://github.com/Dishairano/nih-plug-hardwave.git", branch = "main" }

# Webview editor (replaces vizia)
wry = { version = "0.46", optional = true }

# WebSocket client
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }

# Serialization
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Token persistence (home dir detection)

# Base64 encoding for debug log upload
base64 = "0.22"
dirs = "5"

# FFT
rustfft = "6.2"

# Thread-safe communication
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Atomic float operations
atomic_float = "1"

# Ed25519 signature verification for offline subscription cache
ed25519-dalek = { version = "2", default-features = false }

# Thread CPU clock for the audio-thread benchmark (src/bench.rs)
[dev-dependencies]
libc = "0.2"

# GTK for Linux webview event loop
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# The editor's WebView2, built without making the host wait (src/webview_win.rs). The versions wry
# 0.46 uses, so nothing is compiled twice.
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["gui", "gtk"]
gui = ["wry"]

[profile.release]
lto = "thin"
strip = true
