[workspace]
members = ["xtask"]

[package]
name = "hardwave-analyser"
version = "1.0.11"
edition = "2021"
authors = ["Hardwave Studios"]
license = "MIT"
description = "VST3/CLAP spectrum analyser plugin with embedded webview UI"

[lib]
crate-type = ["cdylib"]

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
# native-tls's `vendored` feature bundles a static OpenSSL for the Linux
# build (the self-hosted runner has no libssl-dev and can't sudo-install).
# On Windows it transparently uses Schannel and on macOS SecureTransport,
# so the OpenSSL bundle only ships in the Linux artefact.
native-tls = { version = "0.2", features = ["vendored"] }
nih_plug = { git = "https://github.com/Dishairano/nih-plug-hardwave.git", branch = "main" }

# Webview editor (replaces vizia)
wry = { version = "0.46", optional = true }

# WebSocket client
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }

# Serialization
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Token persistence (home dir detection)

# Base64 encoding for debug log upload
base64 = "0.22"
dirs = "5"

# FFT
rustfft = "6.2"

# Thread-safe communication
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Atomic float operations
atomic_float = "1"

# Ed25519 signature verification for offline subscription cache
ed25519-dalek = { version = "2", default-features = false }

# GTK for Linux webview event loop
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
default = ["gui", "gtk"]
gui = ["wry"]

[profile.release]
lto = "thin"
strip = true
